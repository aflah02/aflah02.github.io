  position: Research Software Engineer
  summary: I am a first-year PhD student at MPI-SWS, advised by <a href="https://people.mpi-sws.org/~gummadi/" target="_blank" rel="noopener noreferrer">Dr. Krishna P. Gummadi</a> and <a href="https://lasharavichander.github.io/" target="_blank" rel="noopener noreferrer">Dr. Abhilasha Ravichander</a>. I am a member of the Networked Systems Research Group and <a href="https://lasharavichander.github.io/group.html" target="_blank" rel="noopener noreferrer">QUEST Lab</a>. My research examines the capabilities and limitations of large language models (LLMs), with an emphasis on improving their performance and reliability. Previously, as a Research Software Engineer, I worked on pre-training and inference optimization, tool use and reasoning, memorization, parameter-efficient fine-tuning (PEFT), and factual knowledge acquisition and evaluation. I also built and maintained OpenChat, an internal chatbot; MaxCast, a research paper-to-podcast service; and MaxChat, a document-based conversational system, including their on-premises model deployment and performance optimization.

