# Site settings
title: "Mohammad Aflah Khan"
description: "Mohammad Aflah Khan"

# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed

# Development files that should not be copied into the generated site.
exclude:
  - .devcontainer
  - .dockerignore
  - compose.yaml
  - Dockerfile
  - README.md

# Resume settings
resume_avatar:                  "true"
resume_name:                    "Mohammad Aflah Khan"
resume_title:                   "Research Software Engineer @ MPI-SWS · Research Scientist @ EleutherAI"

# used for the contact button in _layouts/resume.html
